<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>교실 자리배치표</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  body { 
    font-family: 'Malgun Gothic', sans-serif; 
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    background-color: #f4f7f6;
    margin: 0;
    padding: 20px;
  }
  
  .settings-container {
    background: #fff;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    margin-bottom: 20px;
    width: 800px;
    max-width: 95%;
    display: flex;
    flex-direction: column;
    gap: 15px;
    border: 2px solid #e0e0e0;
  }
  .settings-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 18px;
    font-weight: bold;
    color: #333;
  }
  .student-count {
    font-size: 14px;
    color: #666;
    background: #f0f2f5;
    padding: 5px 10px;
    border-radius: 20px;
  }
  .input-methods {
    display: flex;
    gap: 20px;
  }
  .input-method-box {
    flex: 1;
    background: #f8f9fa;
    padding: 15px;
    border-radius: 8px;
    border: 1px dashed #ccc;
  }
  .input-method-box h4 {
    margin-top: 0;
    margin-bottom: 10px;
    color: #444;
    font-size: 15px;
  }
  .file-input-wrapper {
    margin-bottom: 10px;
  }
  input[type="file"] {
    display: block;
    width: 100%;
    padding: 8px;
    background: #fff;
    border: 1px solid #ccc;
    border-radius: 5px;
    cursor: pointer;
  }
  textarea {
    width: 100%;
    height: 100px;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 8px;
    resize: vertical;
    font-family: inherit;
    font-size: 14px;
    box-sizing: border-box;
  }
  textarea:focus {
    outline: none;
    border-color: #4CAF50;
    box-shadow: 0 0 5px rgba(76, 175, 80, 0.3);
  }
  .apply-btn {
    background-color: #607d8b;
    align-self: stretch;
    margin-top: 10px;
    color: white;
    font-weight: bold;
    border: none;
    border-radius: 8px;
    padding: 12px 24px;
    cursor: pointer;
    transition: all 0.3s;
  }
  .apply-btn:hover {
    background-color: #455a64;
  }

  .controls { 
    margin-bottom: 20px; 
    display: flex; 
    gap: 15px; 
  }
  button.action-btn { 
    padding: 12px 24px; 
    font-size: 16px; 
    cursor: pointer; 
    border: none;
    border-radius: 8px;
    color: white;
    font-weight: bold;
    transition: all 0.3s;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
  }
  button.action-btn:hover {
    transform: translateY(-2px);
  }
  button.action-btn:active {
    transform: translateY(0);
  }
  
  .classroom-container {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 40px;
    padding: 50px;
    background: #ffffff;
    border: 4px solid #555;
    border-radius: 15px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    position: relative;
  }
  .side-text {
    writing-mode: vertical-rl;
    text-orientation: upright;
    font-size: 32px;
    font-weight: 900;
    color: #666;
    letter-spacing: 20px;
    user-select: none;
  }
  .main-area {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .desks-container {
    display: flex;
    gap: 60px;
    margin-bottom: 20px;
  }
  .section {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: repeat(5, 1fr);
    gap: 15px 6px;
  }
  .desk {
    width: 80px;
    height: 55px;
    border: 2px solid #a38a6a;
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: #fcebd2;
    font-size: 18px;
    font-weight: bold;
    border-radius: 6px;
    color: #333;
    box-shadow: 2px 2px 5px rgba(0,0,0,0.1);
    transition: background-color 0.3s;
    text-align: center;
  }
  .desk.empty {
    background-color: #f8f9fa;
    border-color: #dee2e6;
    box-shadow: none;
  }
  .section-labels {
    display: flex;
    gap: 60px;
    width: 100%;
    justify-content: center;
    font-size: 15px;
    font-weight: bold;
    color: #777;
    margin-bottom: 30px;
  }
  .section-labels div {
    width: 166px;
    text-align: center;
  }
  .teacher-desk {
    width: 180px;
    height: 55px;
    border: 3px solid #333;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 22px;
    background-color: #e2e3e5;
    border-radius: 8px;
    color: #333;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
  }
  
  #countdown-overlay {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.85);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    flex-direction: column;
  }
  #countdown-text {
    font-size: 200px;
    color: #fff;
    font-weight: 900;
    text-shadow: 0 0 30px rgba(255,255,255,0.7);
    margin: 0;
    animation: pop 1s infinite;
  }
  .countdown-msg {
    color: #fff;
    font-size: 24px;
    margin-top: 20px;
    font-weight: bold;
  }
  @keyframes pop {
    0% { transform: scale(0.8); opacity: 0; }
    20% { transform: scale(1.1); opacity: 1; }
    50% { transform: scale(1); opacity: 1; }
    100% { transform: scale(0.9); opacity: 0; }
  }
</style>
</head>
<body>

<div class="settings-container" data-html2canvas-ignore="true">
  <div class="settings-header">
    <span>👨‍🏫 명단 설정 (엑셀 업로드 및 복사/붙여넣기 지원)</span>
    <span class="student-count" id="student-count">현재 학생 수: 0명 / 최대 30명</span>
  </div>
  
  <div class="input-methods">
    <div class="input-method-box">
      <h4>방식 1. 엑셀(.xlsx) 파일 업로드</h4>
      <div class="file-input-wrapper">
        <input type="file" id="excel-upload" accept=".xlsx, .xls, .csv">
      </div>
      <p style="font-size:12px; color:#666; margin:0;">
        ※ '이름' 또는 '성명' 열을 자동으로 찾아 읽습니다.<br>
        ※ 빈칸은 전학/자퇴생으로 간주해 자동 제외됩니다.
      </p>
    </div>
    
    <div class="input-method-box">
      <h4>방식 2. 엑셀/한글 내용 복사해서 붙여넣기</h4>
      <textarea id="student-input" placeholder="'1. 홍길동' 또는 '1 강우진' 처럼 번호와 함께 붙여넣어도 이름만 쏙 뽑아냅니다.&#13;&#10;(줄바꿈, 쉼표, 띄어쓰기 모두 자동 인식)"></textarea>
    </div>
  </div>
  
  <button class="apply-btn" onclick="applyStudents()">위 내용으로 명단 적용하기</button>
</div>

<div class="controls" data-html2canvas-ignore="true">
  <button class="action-btn" onclick="startShuffle()" style="background-color:#FF9800;">랜덤 셔플</button>
  <button class="action-btn" onclick="resetSeats()" style="background-color:#F44336;">초기화</button>
  <button class="action-btn" onclick="capture()" style="background-color:#2196F3;">캡처 (PNG 다운로드)</button>
</div>

<div class="classroom-container" id="classroom">
  <div class="side-text">복도</div>
  
  <div class="main-area">
    <div class="desks-container" id="desks"></div>
    
    <div class="section-labels">
      <div>1분단</div>
      <div>2분단</div>
      <div>3분단</div>
    </div>

    <div class="teacher-desk">교탁</div>
  </div>
  
  <div class="side-text">창문</div>
</div>

<div id="countdown-overlay">
  <div id="countdown-text">10</div>
  <div class="countdown-msg">새로운 자리 배치 중...</div>
</div>

<script>
  let students = []; 
  
  document.getElementById('excel-upload').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
      const data = new Uint8Array(e.target.result);
      const workbook = XLSX.read(data, {type: 'array'});
      
      const firstSheetName = workbook.SheetNames[0];
      const worksheet = workbook.Sheets[firstSheetName];
      const json = XLSX.utils.sheet_to_json(worksheet, {header: 1});
      
      let nameColIdx = -1;
      let startRow = 0;
      
      for(let r=0; r<Math.min(json.length, 10); r++) {
        if(!json[r]) continue;
        for(let c=0; c<json[r].length; c++) {
          const cellValue = String(json[r][c] || "").trim();
          if(cellValue === "이름" || cellValue === "성명") {
            nameColIdx = c;
            startRow = r + 1;
            break;
          }
        }
        if(nameColIdx !== -1) break;
      }
      
      if(nameColIdx === -1) {
        nameColIdx = 1; 
        startRow = 1;
      }

      let extractedNames = [];
      for(let r = startRow; r < json.length; r++) {
        const row = json[r];
        if(!row || row.length === 0) continue;
        const name = String(row[nameColIdx] || "").trim();
        if(name && name !== "undefined") {
          extractedNames.push(name);
        }
      }
      
      if(extractedNames.length > 0) {
        document.getElementById('student-input').value = extractedNames.join("\n");
        applyStudents();
      } else {
        alert("엑셀 파일에서 학생 명단을 추출하지 못했습니다.\n열 이름이 '성명' 또는 '이름'인지 확인해보세요.");
      }
    };
    reader.readAsArrayBuffer(file);
  });

  let audioCtx = null;
  function initAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
  }

  function playBeep(isFinal = false) {
    initAudio();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gainNode = audioCtx.createGain();
    
    osc.connect(gainNode);
    gainNode.connect(audioCtx.destination);
    
    if (isFinal) {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); 
      osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1);
      osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.2);
      osc.frequency.setValueAtTime(1046.50, audioCtx.currentTime + 0.3); 
      gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1);
      osc.start(audioCtx.currentTime);
      osc.stop(audioCtx.currentTime + 1);
    } else {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(880, audioCtx.currentTime); 
      gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
      osc.start(audioCtx.currentTime);
      osc.stop(audioCtx.currentTime + 0.15);
    }
  }

  function updateStudentCount() {
    document.getElementById('student-count').textContent = `현재 학생 수: ${students.length}명 / 최대 30명`;
  }

  function applyStudents() {
    const input = document.getElementById('student-input').value;
    const lines = input.split(/[\n,]+/);
    let newStudents = [];
    
    for(let line of lines) {
      let cleanLine = line.trim();
      if(!cleanLine) continue;
      
      cleanLine = cleanLine.replace(/^\d+[\s\.\-\_]*/, '').trim();
      
      if(cleanLine) {
        newStudents.push(cleanLine);
      }
    }
    
    if (newStudents.length > 30) {
      alert("학생 수는 최대 30명까지 배치할 수 있습니다.\n초과된 인원을 제외하거나 줄여주세요.");
      return;
    }
    if (newStudents.length === 0) {
      alert("학생 명단을 인식할 수 없습니다.");
      return;
    }
    
    students = newStudents;
    updateStudentCount();
    resetSeats();
    
    document.getElementById('student-input').value = students.join(", ");
    alert(`${students.length}명의 명단이 성공적으로 적용되었습니다!\n[랜덤 셔플] 버튼을 눌러 자리를 배치해보세요.`);
  }

  function initSeats() {
    const container = document.getElementById('desks');
    container.innerHTML = '';
    
    for (let s = 0; s < 3; s++) {
      const section = document.createElement('div');
      section.className = 'section';
      
      for (let r = 0; r < 5; r++) {
        for (let c = 0; c < 2; c++) {
          const desk = document.createElement('div');
          desk.className = 'desk empty';
          const pairIndex = (4 - r) * 3 + s;
          desk.dataset.pair = pairIndex;
          desk.dataset.c = c;
          section.appendChild(desk);
        }
      }
      container.appendChild(section);
    }
  }

  let isShuffling = false;

  function startShuffle() {
    if (isShuffling) return;
    if (students.length === 0) {
      alert("적용된 학생 명단이 없습니다. 명단을 입력 후 적용해주세요.");
      return;
    }
    isShuffling = true;
    
    resetSeats(); 
    initAudio();  
    
    const overlay = document.getElementById('countdown-overlay');
    const countText = document.getElementById('countdown-text');
    overlay.style.display = 'flex';
    
    let count = 10;
    
    countText.textContent = count;
    playBeep();
    
    countText.style.animation = 'none';
    void countText.offsetWidth; 
    countText.style.animation = 'pop 1s infinite';

    const interval = setInterval(() => {
      count--;
      if (count > 0) {
        countText.textContent = count;
        playBeep();
      } else {
        clearInterval(interval);
        overlay.style.display = 'none';
        playBeep(true); 
        executeShuffle();
        isShuffling = false;
      }
    }, 1000);
  }

  function executeShuffle() {
    const shuffled = [...students].sort(() => Math.random() - 0.5);
    
    let pairCapacities = [];
    let remaining = shuffled.length;
    
    for (let r = 0; r < 5; r++) {
      let rowCaps = [];
      if (remaining >= 6) {
        rowCaps = [2, 2, 2];
        remaining -= 6;
      } else if (remaining > 0) {
        if (remaining === 5) rowCaps = [2, 2, 1];
        else if (remaining === 4) rowCaps = [2, 2, 0];
        else if (remaining === 3) rowCaps = [2, 1, 0];
        else if (remaining === 2) rowCaps = [2, 0, 0];
        else if (remaining === 1) rowCaps = [1, 0, 0];
        remaining = 0;
      } else {
        rowCaps = [0, 0, 0];
      }
      
      rowCaps.sort(() => Math.random() - 0.5);
      pairCapacities.push(...rowCaps);
    }
    
    let studentIndex = 0;
    const pairAssignments = {}; 
    
    for (let p = 0; p < 15; p++) {
      pairAssignments[p] = [];
      const cap = pairCapacities[p];
      
      for (let i = 0; i < cap; i++) {
        if (studentIndex < shuffled.length) {
          pairAssignments[p].push(shuffled[studentIndex++]);
        }
      }
      
      while (pairAssignments[p].length < 2) {
        pairAssignments[p].push("");
      }
      
      pairAssignments[p].sort(() => Math.random() - 0.5);
    }
    
    const desks = document.querySelectorAll('.desk');
    desks.forEach(desk => {
      const p = parseInt(desk.dataset.pair);
      const c = parseInt(desk.dataset.c);
      
      const name = pairAssignments[p][c];
      desk.textContent = name;
      
      if (name === "") {
        desk.classList.add('empty');
      } else {
        desk.classList.remove('empty');
      }
    });
  }

  function resetSeats() {
    if (isShuffling) return; 
    const desks = document.querySelectorAll('.desk');
    desks.forEach(desk => {
      desk.textContent = '';
      desk.classList.add('empty');
    });
  }

  function capture() {
    if (isShuffling) return;
    const target = document.getElementById('classroom');
    html2canvas(target, { backgroundColor: '#ffffff', scale: 2 }).then(canvas => {
      const link = document.createElement('a');
      link.download = '자리배치표.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    });
  }

  window.onload = function() {
    updateStudentCount();
    initSeats();
  };
</script>
</body>
</html>
